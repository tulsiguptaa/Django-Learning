<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% load cache %}

<h1>My Dashboard</h1>

<p>Welcome back!</p>

{% cache 300 popular_courses %}
    <h2>Popular Courses</h2>

    {% for course in popular_courses %}
        <p>{{ course.name }}</p>
    {% endfor %}
{% endcache %}
</body>
</html>
